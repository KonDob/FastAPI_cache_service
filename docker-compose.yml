services:
  app:
    build: .
    environment:
      # Inside the compose network the database is reached by service name, not localhost.
      DATABASE_URL: postgresql+psycopg://cache:cache@db:5432/cache
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        # Start only once PostgreSQL accepts connections, not merely once its container runs.
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cache
      POSTGRES_PASSWORD: cache
      POSTGRES_DB: cache
    ports:
      # Overridable because 5432 is often taken by a local PostgreSQL.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache -d cache"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
