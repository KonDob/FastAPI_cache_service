services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cache
      POSTGRES_PASSWORD: cache
      POSTGRES_DB: cache
    ports:
      # Overridable because 5432 is often taken by a local PostgreSQL.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache -d cache"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
